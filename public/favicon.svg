<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Leaf Primary Gradient -->
    <linearGradient id="leafGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Golden Sprout Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Outer Badge with smooth corners -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.3" />

  <!-- Central Synapse-Plant Emblem (AJ STUDIOZ Agrisynapse) -->
  <g filter="url(#subtleGlow)" transform="translate(12, 10)">
    <!-- Soil Baseline / Agricultural Ground Arc -->
    <path d="M18 84 C38 78, 66 78, 86 84" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Main Stem -->
    <path d="M52 82 Q52 52 52 32" stroke="#6ee7b7" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- Left Sprout Leaf -->
    <path d="M52 58 C32 54, 18 38, 22 24 C38 22, 50 38, 52 56 Z" fill="url(#leafGradPrimary)" />
    <path d="M52 57 C36 44, 25 31, 23 25" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.3" />

    <!-- Right Sprout Leaf -->
    <path d="M52 48 C72 44, 86 28, 82 14 C66 12, 54 28, 52 46 Z" fill="#6ee7b7" />
    <path d="M52 47 C68 34, 79 21, 81 15" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.3" />

    <!-- Central Golden Seed / Intelligence Sun Core -->
    <circle cx="52" cy="24" r="7.5" fill="url(#goldGrad)" />
    <circle cx="52" cy="24" r="11" fill="#fde047" opacity="0.25" />

    <!-- Tech Synapse Nodes -->
    <circle cx="22" cy="24" r="3" fill="#ecfdf5" />
    <circle cx="82" cy="14" r="3" fill="#ecfdf5" />
  </g>
</svg>
